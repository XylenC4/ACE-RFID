name: Android release

on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/AceRFID
    steps:
      - name: Set version
        working-directory: .
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "TAG=android-${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AceRFID-$VERSION_NAME.apk"

      - name: Generate changelog
        run: |
          PREV=$(git tag --list 'android-*' --sort=-version:refname | head -n1)
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='### %s%n%n%b' "$RANGE" -- . ../../.github
            if [ -n "$PREV" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > "$RUNNER_TEMP/CHANGELOG.md"
          sed -i '/^Co-Authored-By:/d' "$RUNNER_TEMP/CHANGELOG.md"
          cat "$RUNNER_TEMP/CHANGELOG.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ACE RFID ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/CHANGELOG.md
          files: ${{ runner.temp }}/AceRFID-${{ env.VERSION_NAME }}.apk
